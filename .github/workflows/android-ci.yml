name: Android CI (build check)

# Проверочная сборка на каждый push / pull request в main —
# чтобы ошибки компиляции ловились до релиза.
on:
  push:
    branches: [main]
    paths:
      - "zi-writer/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "zi-writer/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: zi-writer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle memory settings for CI
        shell: bash
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
          kotlin.daemon.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.daemon=false
          PROPS

      - run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: zi-writer/app/build/outputs/apk/debug/*.apk
          retention-days: 14
